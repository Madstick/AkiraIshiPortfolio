<script>
(() => {
"use strict";
const IS_WORKER=typeof self!=="undefined" && self.IS_NM_WORKER===true;
const SRC=(!IS_WORKER && document.currentScript)?document.currentScript.textContent:null;
let URLQ=IS_WORKER?"":location.search;
if(!IS_WORKER) console.log("Nature Morte — generative still life, 2026");

/* =============================================================================
   0. RANDOMNESS
   Every number comes from sfc32 seeded by a string. ?seed=xxx reproduces a
   painting exactly; without it a fresh seed is drawn.
   ========================================================================== */
function xmur3(str){ let h=1779033703^str.length; for(let i=0;i<str.length;i++){h=Math.imul(h^str.charCodeAt(i),3432918353);h=(h<<13)|(h>>>19);} return ()=>{h=Math.imul(h^(h>>>16),2246822507);h=Math.imul(h^(h>>>13),3266489909);return (h^=h>>>16)>>>0;}; }
function sfc32(a,b,c,d){ return ()=>{a>>>=0;b>>>=0;c>>>=0;d>>>=0;let t=(a+b)|0;a=b^(b>>>9);b=(c+(c<<3))|0;c=(c<<21)|(c>>>11);d=(d+1)|0;t=(t+d)|0;c=(c+t)|0;return (t>>>0)/4294967296;}; }
function makeRng(s){ const h=xmur3(s); return sfc32(h(),h(),h(),h()); }
let rand = Math.random;
const rr=(a,b)=>a+(b-a)*rand();
const ri=(a,b)=>Math.floor(rr(a,b+1));
const pick=a=>a[Math.floor(rand()*a.length)];
function wpick(o){ let s=0; for(const k in o) s+=o[k]; let r=rand()*s; for(const k in o){ r-=o[k]; if(r<=0) return k; } return Object.keys(o)[0]; }

const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=(e0,e1,x)=>{ const t=clamp((x-e0)/(e1-e0),0,1); return t*t*(3-2*t); };
const fract=x=>x-Math.floor(x);

/* Perlin gradient noise (improved), permutation drawn from the seed. */
const PERM=new Uint8Array(512);
function initNoise(){ const p=[]; for(let i=0;i<256;i++)p.push(i); for(let i=255;i>0;i--){const j=Math.floor(rand()*(i+1));[p[i],p[j]]=[p[j],p[i]];} for(let i=0;i<512;i++)PERM[i]=p[i&255]; }
function grd(h,x,y,z){ h&=15; const u=h<8?x:y, v=h<4?y:(h===12||h===14?x:z); return ((h&1)?-u:u)+((h&2)?-v:v); }
function noise3(x,y,z){
  let X=Math.floor(x),Y=Math.floor(y),Z=Math.floor(z); x-=X;y-=Y;z-=Z; X&=255;Y&=255;Z&=255;
  const u=x*x*x*(x*(x*6-15)+10), v=y*y*y*(y*(y*6-15)+10), w=z*z*z*(z*(z*6-15)+10);
  const A=PERM[X]+Y,AA=PERM[A]+Z,AB=PERM[A+1]+Z,B=PERM[X+1]+Y,BA=PERM[B]+Z,BB=PERM[B+1]+Z;
  return lerp(lerp(lerp(grd(PERM[AA],x,y,z),grd(PERM[BA],x-1,y,z),u),lerp(grd(PERM[AB],x,y-1,z),grd(PERM[BB],x-1,y-1,z),u),v),
              lerp(lerp(grd(PERM[AA+1],x,y,z-1),grd(PERM[BA+1],x-1,y,z-1),u),lerp(grd(PERM[AB+1],x,y-1,z-1),grd(PERM[BB+1],x-1,y-1,z-1),u),v),w);
}
const noise2=(x,y)=>noise3(x,y,0.371);
function fbm3(x,y,z,o){ let s=0,a=0.5; for(let i=0;i<o;i++){ s+=a*noise3(x,y,z); x*=2.03;y*=2.03;z*=2.03; a*=0.5; } return s; }
function hash3i(x,y,z){ let h=(Math.imul(x|0,374761393)+Math.imul(y|0,668265263)+Math.imul(z|0,1274126177))|0; h=Math.imul(h^(h>>>13),1274126177); return ((h^(h>>>16))>>>0)/4294967296; }
/* small round dots on a 3D lattice (lenticels, pores, speckles) */
function dots(x,y,z,f,sz){ const X=x*f,Y=y*f,Z=z*f, ix=Math.floor(X),iy=Math.floor(Y),iz=Math.floor(Z);
  const h=hash3i(ix,iy,iz); if(h>0.55) return 0;
  const cx=ix+0.3+0.4*hash3i(iy,iz,ix+7), cy=iy+0.3+0.4*hash3i(iz,ix,iy+3), cz=iz+0.3+0.4*hash3i(ix+1,iy+9,iz);
  const d=Math.hypot(X-cx,Y-cy,Z-cz); return 1-smooth(sz*0.5,sz,d); }

/* colour helpers: authored in sRGB 0-255, used as linear reflectance */
const s2l=v=>{ v/=255; return v<=0.04045?v/12.92:Math.pow((v+0.055)/1.055,2.4); };
const C=(r,g,b)=>[s2l(r),s2l(g),s2l(b)];
const mixc=(a,b,t)=>[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];
const lum=(r,g,b)=>0.2126*r+0.7152*g+0.0722*b;

/* =============================================================================
   1. PIGMENTS — Kubelka-Munk
   Haase & Meyer 1992: a paint layer of infinite thickness has reflectance
   R = 1 + K/S - sqrt((K/S)^2 + 2K/S); a mixture sums K and S weighted by
   concentration. Sochorová & Jamriška 2021 show this is what makes digital
   paint mix like paint. Three wavebands (R,G,B) stand in for the spectrum.
   Palette: pigments available to a 17th-century workshop.
   ========================================================================== */
const ksOf=R=>{ R=R<0.0015?0.0015:R>0.999?0.999:R; return (1-R)*(1-R)/(2*R); };
const Rof=k=>1+k-Math.sqrt(k*k+2*k);
const kmMix=(a,b,t)=>Rof(ksOf(a)*(1-t)+ksOf(b)*t);
const PIGMENTS = { // name: [sRGB masstone, scattering (hiding) strength]
  "lead white":[[242,238,226],1.0], "yellow ochre":[[188,138,58],0.45], "lead-tin yellow":[[236,206,104],0.6],
  "vermilion":[[206,50,34],0.6], "red lake":[[140,18,44],0.10], "burnt sienna":[[136,60,32],0.32],
  "raw umber":[[78,61,45],0.38], "bone black":[[24,22,21],0.45], "azurite":[[44,74,148],0.25],
  "verdigris":[[38,118,94],0.22], "green earth":[[102,116,82],0.18]
};
let PIG=[]; // {name,K[3],S}
let CAND=null, CANDLAB=null, SNAPLUT=null;
function lin2lab(r,g,b){
  let X=(0.4124*r+0.3576*g+0.1805*b)/0.9505, Y=0.2126*r+0.7152*g+0.0722*b, Z=(0.0193*r+0.1192*g+0.9505*b)/1.089;
  const f=t=>t>0.008856?Math.cbrt(t):7.787*t+16/116; const fx=f(X),fy=f(Y),fz=f(Z);
  return [116*fy-16, 500*(fx-fy), 200*(fy-fz)];
}
function buildPalette(){
  PIG=Object.entries(PIGMENTS).map(([name,[rgb,S]])=>{ const R=C(...rgb); return {name,S,K:R.map(v=>S*ksOf(v))}; });
  const mixOf=list=>{ const out=[0,0,0]; let S=0; const K=[0,0,0];
    for(const [p,c] of list){ S+=p.S*c; for(let i=0;i<3;i++) K[i]+=p.K[i]*c; }
    for(let i=0;i<3;i++) out[i]=Rof(K[i]/S); return out; };
  const white=PIG[0], cands=[];
  const whites=[0,0.12,0.3,0.52,0.75,0.9];
  for(let i=1;i<PIG.length;i++) for(let j=i;j<PIG.length;j++) for(const a of (i===j?[0]:[0.25,0.5,0.75])) for(const w of whites){
    const list=[[PIG[i],(1-a)*(1-w)],[PIG[j],a*(1-w)]]; if(w>0) list.push([white,w]); cands.push(mixOf(list));
  }
  cands.push(mixOf([[white,1]]));
  CAND=new Float32Array(cands.length*3); CANDLAB=new Float32Array(cands.length*3);
  cands.forEach((c,k)=>{ CAND.set(c,k*3); CANDLAB.set(lin2lab(...c),k*3); });
  SNAPLUT=new Int16Array(32768).fill(-1);
}
/* nearest palette mixture to a colour (cached on a 32^3 perceptual grid) */
function snap(r,g,b,out){
  const qr=Math.min(31,(Math.sqrt(Math.max(0,r))*32)|0), qg=Math.min(31,(Math.sqrt(Math.max(0,g))*32)|0), qb=Math.min(31,(Math.sqrt(Math.max(0,b))*32)|0);
  const key=(qr<<10)|(qg<<5)|qb; let k=SNAPLUT[key];
  if(k<0){ const cr=((qr+0.5)/32)**2, cg=((qg+0.5)/32)**2, cb=((qb+0.5)/32)**2; const L=lin2lab(cr,cg,cb);
    let best=1e9; const n=CAND.length/3;
    for(let i=0;i<n;i++){ const dl=(CANDLAB[i*3]-L[0])*1.4, da=CANDLAB[i*3+1]-L[1], db=CANDLAB[i*3+2]-L[2]; const d=dl*dl+da*da+db*db; if(d<best){best=d;k=i;} }
    SNAPLUT[key]=k; }
  out[0]=CAND[k*3]; out[1]=CAND[k*3+1]; out[2]=CAND[k*3+2];
}

   ========================================================================== */

/* =============================================================================
   3. GEOMETRY — signed distance functions
   ========================================================================== */
function sdCapsule(px,py,pz,ax,ay,az,bx,by,bz,r){ const pax=px-ax,pay=py-ay,paz=pz-az,bax=bx-ax,bay=by-ay,baz=bz-az;
  const h=clamp((pax*bax+pay*bay+paz*baz)/(bax*bax+bay*bay+baz*baz),0,1); return Math.hypot(pax-bax*h,pay-bay*h,paz-baz*h)-r; }
function sdEllipsoid(x,y,z,a,b,c){ const k0=Math.hypot(x/a,y/b,z/c), k1=Math.hypot(x/(a*a),y/(b*b),z/(c*c)); return k1<1e-9?-Math.min(a,b,c):k0*(k0-1)/k1; }
function smin(a,b,k){ const h=clamp(0.5+0.5*(b-a)/k,0,1); return lerp(b,a,h)-k*h*(1-h); }
/* surface of revolution: distance in the (rho,y) half-plane to a set of polylines */
function lathe(polys){ const segs=[]; for(const p of polys) for(let i=0;i<p.length-1;i++) segs.push(p[i][0],p[i][1],p[i+1][0],p[i+1][1]);
  const n=segs.length; const f=new Float64Array(segs);
  return (r,y)=>{ let best=1e9; for(let i=0;i<n;i+=4){ const ax=f[i],ay=f[i+1],dx=f[i+2]-ax,dy=f[i+3]-ay, qx=r-ax,qy=y-ay;
      const h=clamp((qx*dx+qy*dy)/(dx*dx+dy*dy+1e-12),0,1); const ex=qx-dx*h, ey=qy-dy*h, d=ex*ex+ey*ey; if(d<best)best=d; } return Math.sqrt(best); }; }
/* Catmull-Rom resampling of a profile */
function spline(pts,sub){ const out=[]; for(let i=0;i<pts.length-1;i++){ const p0=pts[Math.max(0,i-1)],p1=pts[i],p2=pts[i+1],p3=pts[Math.min(pts.length-1,i+2)];
  for(let s=0;s<sub;s++){ const t=s/sub,t2=t*t,t3=t2*t; out.push([0,1].map(k=>0.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3))); } }
  out.push(pts[pts.length-1]); return out; }
/* orthonormal frame: local y = up, rotated by yaw about it */
function frame(ux,uy,uz,yaw){ let l=Math.hypot(ux,uy,uz); ux/=l;uy/=l;uz/=l;
  let rx=1,ry=0,rz=0; if(Math.abs(ux)>0.9){rx=0;rz=1;}
  const d=rx*ux+ry*uy+rz*uz; let ax=rx-d*ux,ay=ry-d*uy,az=rz-d*uz; l=Math.hypot(ax,ay,az); ax/=l;ay/=l;az/=l;
  const bx=uy*az-uz*ay, by=uz*ax-ux*az, bz=ux*ay-uy*ax, c=Math.cos(yaw), s=Math.sin(yaw);
  const X=[ax*c+bx*s, ay*c+by*s, az*c+bz*s], Z=[bx*c-ax*s, by*c-ay*s, bz*c-az*s];
  return [X[0],X[1],X[2],ux,uy,uz,Z[0],Z[1],Z[2]]; }

/* =============================================================================

   Soft shadows by the penumbra estimate of the distance field; ambient
   occlusion from five distance samples along the normal. Fruit skin uses
   wrap lighting (Green 2004) with a saturated terminator; peach, quince and
   plum bloom add the asperity-scattering rim of Koenderink & Pont 2003.

/* =============================================================================
   12. THE PAINTING PROCESS

/* brush passes: the manner's own list (plus the detail versions' finer

function paintSignature(opt){ opt=opt||{}; const u=W/1200, caps=rand()<0.3, name=caps?"AKIRA ISHI":"Akira Ishi", G=caps?SIG_CAPS:SIG_SCRIPT, AW=caps?SIG_CW:SIG_SW;

    strokes.push(k==="under"?[[-0.1,-0.3],[L*0.3,-0.5],[L*0.7,-0.42],[L+0.25,-0.2]]

/* =============================================================================
   12c. OTHER MEDIA — three invented manners that are not oil paint
   Delft tableau (cobalt on tin glaze, on tiles), Mokuhanga (a woodblock
   print of a Dutch still life), Silk needle-painting (long-and-short satin
   stitch in twisted silk). Same motif, same light; only the medium changes.
   ========================================================================== */
/* silhouettes and strong interior edges, 0..1 (used for outlines) */
function edgeMap(thr){ const N=W*H, E=new Float32Array(N), L=new Float32Array(N), Lb=new Float32Array(N);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x, id=IDF[i];
    if((x<W-1&&IDF[i+1]!==id)||(y<H-1&&IDF[i+W]!==id)) E[i]=(id===0&&IDF[i+1]<=2&&IDF[i+W]<=2)?0.6:1; }
  for(let i=0;i<N;i++) L[i]=Math.sqrt(lum(TR[i],TG[i],TB[i])); gauss(L,Lb,W,H,1.6*SC);
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const i=y*W+x; const gx=Lb[i+1]-Lb[i-1], gy=Lb[i+W]-Lb[i-W]; const g=Math.hypot(gx,gy)*SC;
    if(IDF[i]>=3) E[i]=Math.max(E[i],smooth(thr,thr*2.2,g)*0.8); }
  const Eb=new Float32Array(N); gauss(E,Eb,W,H,0.75*SC); for(let i=0;i<N;i++) Eb[i]=Math.min(1,Eb[i]*2.4); return Eb; }

/* ---------------- Delft tableau ---------------- */
const COB=C(18,42,128), GLZ=C(242,240,230);
async function paintDelft(tok){ const N=W*H;

  for(let i=0;i<N;i++){ const t=Math.pow(clamp((Math.sqrt(lum(TR[i],TG[i],TB[i]))-0.07)/0.5+(IDF[i]===0?0.22:0),0,1),0.62);

  for(let y=0;y<H;y+=g) for(let x=0;x<W;x+=g){ const i=Math.min(H-1,y+(rand()*g|0))*W+Math.min(W-1,x+(rand()*g|0)); const L=lum(mr[i],mg[i],mb[i]);
    if(L>0.08&&L<0.5&&rand()<0.35){ const k=0.8; renderStroke([i%W,(i/W)|0],(0.9+0.5*rand())*SC,mr[i]*k,mg[i]*k,mb[i]*k,{op:0.8,dep:0,thick:0.02,clip:0}); } }

  for(let i=0;i<N;i++){ const w=E[i]*(0.75+0.35*noise2((i%W)*0.03/SC+off,(i/W|0)*0.03/SC)); const a=smooth(0.3,0.75,w)*0.95; if(a>0){ CR[i]=kmMix(CR[i],dk[0],a); CG[i]=kmMix(CG[i],dk[1],a); CB[i]=kmMix(CB[i],dk[2],a); } }

}
async function finishDelft(tok){ status("firing"); await tick(tok,true);
  const d=IMG.data, ts=240*SC, gw=1.5*SC, SR=CR.slice(), SG=CG.slice(), SB=CB.slice(), cols=Math.round(W/ts), rows=Math.round(H/ts);
  const off=[], tint=[]; for(let t=0;t<cols*rows;t++){ off.push([Math.round(rr(-2,2)*SC),Math.round(rr(-2,2)*SC)]); tint.push([1+rr(-0.02,0.015),1+rr(-0.015,0.015),1+rr(-0.03,0.01)]); }
  const S1=rr(7,12)*SC, sx=LSIDE<0?0.22:0.78;
  for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const i=y*W+x;
      const tx=Math.min(cols-1,Math.floor(x/ts)), ty=Math.min(rows-1,Math.floor(y/ts)), t=ty*cols+tx, lx=x-tx*ts, ly=y-ty*ts;

/* ---------------- Mokuhanga ---------------- */
const PAPER=C(236,226,202), SUMI=C(34,30,32);
async function paintWoodblock(tok){ const N=W*H, off=rr(0,50);
  // washi: warm paper with long fibres
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x; const f=noise3(x*0.02/SC,y*0.3/SC,off)*0.5+noise3(x*0.3/SC,y*0.02/SC,off+5)*0.5;
    const k=0.97+0.03*noise2(x*0.004/SC,y*0.004/SC)+0.035*smooth(0.35,0.6,f); CR[i]=PAPER[0]*k; CG[i]=PAPER[1]*k; CB[i]=PAPER[2]*k; }

  // flat colour blocks: each object in three printed tones; walls and table as bokashi gradients
  const L=new Float32Array(N), Lb=new Float32Array(N); for(let i=0;i<N;i++) L[i]=Math.sqrt(lum(TR[i],TG[i],TB[i])); gauss(L,Lb,W,H,2.5*SC);

  const wR=new Float32Array(N),wG=new Float32Array(N),wB=new Float32Array(N); gauss(TR,wR,W,H,26*SC); gauss(TG,wG,W,H,26*SC); gauss(TB,wB,W,H,26*SC);

  const acc=new Map(); const lev=(id,v)=>{ const q=Q.get(id); return v<q[0]?0:v<q[1]?1:2; };
  for(let i=0;i<N;i+=2){ const id=IDF[i]; if(!Q.has(id)) continue; const k=id*3+lev(id,Lb[i]); let a=acc.get(k); if(!a){ a=[0,0,0,0]; acc.set(k,a); } a[0]+=bR[i];a[1]+=bG[i];a[2]+=bB[i];a[3]++; }

    if(Q.has(id)){ const q=Q.get(id), v=Lb[i]; const t0=smooth(q[0]-0.008,q[0]+0.008,v), t1=smooth(q[1]-0.008,q[1]+0.008,v);
      c=mixc(mixc(tone(id,0),tone(id,1),t0),tone(id,2),t1); }
    else { const m=lum(wR[i],wG[i],wB[i]); c=[wR[i],wG[i],wB[i]].map(v=>clamp(m+(v-m)*1.2,0,1)); }
    if(SPEC[i]>0.5 && id>=3) c=mixc(c,PAPER,smooth(0.5,0.9,SPEC[i]));
    CI[i*3]=c[0]; CI[i*3+1]=c[1]; CI[i*3+2]=c[2]; }

  const rx=Math.round(rr(1,3)*SC)*(rand()<0.5?-1:1), ry=Math.round(rr(0,2.5)*SC)*(rand()<0.5?-1:1);
  for(let y=0;y<H;y++) for(let x=0;x<W;x++){ const i=y*W+x, sx=clamp(x-rx,0,W-1), sy=clamp(y-ry,0,H-1), j=sy*W+sx;
    const grain=0.95+0.06*noise2(sx*0.015/SC+off,sy*0.35/SC)+0.04*noise2(sx*0.6/SC,sy*0.6/SC);
    for(let c=0;c<3;c++){ const ink=CI[j*3+c]/PAPER[c]; const v=clamp(ink*grain,0,1.05); if(c===0) CR[i]*=v; else if(c===1) CG[i]*=v; else CB[i]*=v; } }

  const E=edgeMap(0.07);
  for(let i=0;i<N;i++){ const x=i%W,y=(i/W)|0; const brk=smooth(-0.55,-0.35,noise2(x*0.06/SC+off,y*0.06/SC)); const a=smooth(0.3,0.65,E[i])*(1-0.8*(1-brk))*0.95;
    if(a>0){ CR[i]=lerp(CR[i],SUMI[0],a); CG[i]=lerp(CG[i],SUMI[1],a); CB[i]=lerp(CB[i],SUMI[2],a); } }
  HT.fill(0);
  status("signing and sealing"); paintSignature({col:SUMI,seal:true}); await tick(tok,true);
}
async function finishWoodblock(tok){ status("paper and time"); await tick(tok,true); const d=IMG.data, age=PSCH.age*rr(0.6,1.2), off=rr(0,40);
  for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const i=y*W+x; let r=CR[i],g=CG[i],b=CB[i];
      const tone=age*(0.6+0.4*noise2(x*0.003/SC+off,y*0.003/SC)); r*=1-0.02*tone; g*=1-0.05*tone; b*=1-0.14*tone;

    if(y%60===0){ await new Promise(r=>setTimeout(r,0)); if(tok!==TOKEN) throw new Cancel(); ctx.putImageData(IMG,0,0,0,0,W,y+1); } }

let SILK_BARE=false;

  const lx=LSIDE<0?-0.7:0.7, ly=-0.7, sheen=0.82+0.36*Math.abs(dx*ly-dy*lx);
  const P={op:1,full:true,thick:1.0,thread:true,streak:0.02,clip:cfg.clip,cid:cfg.cid,dep:0,noBg:SILK_BARE};
  for(let k=0;k<n;k++){ const o=(k-(n-1)/2)*w*2.05, l=Ls*(k%2?rr(0.55,0.75):rr(0.9,1.1))/2, sh=rr(-0.25,0.25)*Ls, cx=x0+px*o+dx*sh, cy=y0+py*o+dy*sh;

/* =============================================================================
   12d. THREE ORIGINAL MANNERS — not media but ideas about light and time
   Evanescence: light lifts the paint off what it strikes.
   Isophote:    the picture drawn only in lines of equal light (and equal depth).
   Horologium:  a whole day's sun at once; the still life becomes its own clock.

/* Evanescence — wherever light strikes an object the paint frays off its lit
   edges in filaments that drift and curl toward the window; shadows stay whole */

  const wgt=new Float32Array(N); let tot=0;
  for(let i=0;i<N;i++){ if(!m[i]) continue; const L=Math.sqrt(lum(TR[i],TG[i],TB[i])); const lit=smooth(0.38,0.78,L), edge=1-Math.abs(mb[i]*2-1); const w=lit*(0.12+0.88*edge*edge); wgt[i]=w; tot+=w; }

  const pickPix=()=>{ const r=rand()*acc; let lo=0,hi=N-1; while(lo<hi){ const mid=(lo+hi)>>1; if(cdf[mid]<r) lo=mid+1; else hi=mid; } return lo; };

  const P={op:0.42,dep:0.92,thick:0.03,streak:0.05,clip:0};
  for(let k=0;k<n;k++){ const i=pickPix(); let x=i%W+rand(), y=(i/W|0)+rand(); const cr=CR[i]*1.08, cg=CG[i]*1.06, cb=CB[i]*1.04;
    const len=(50+rand()*rand()*320)*u*(0.5+wgt[i]), step=1.8*u, pts=[x,y]; const curl=rr(-2.2,2.2);
    for(let s=0;s<len;s+=step){ const a=base+1.6*noise2(x*0.0024/u+o1,y*0.0024/u)+0.45*noise2(x*0.012/u,y*0.012/u+o2)+curl*(s/len)*(s/len); x+=Math.cos(a)*step; y+=Math.sin(a)*step; if(x<0||y<0||x>=W||y>=H) break; pts.push(x,y); }
    if(pts.length>4) renderStroke(pts,(0.3+0.6*rand()*rand())*u,cr,cg,cb,P);

    if(rand()<0.25){ const bx=clamp(Math.round(i%W+Math.cos(base)*7*u),0,W-1), by=clamp(Math.round((i/W|0)+Math.sin(base)*7*u),0,H-1), j=by*W+bx; renderStroke([i%W,(i/W)|0],(0.8+rand())*u,CR[j],CG[j],CB[j],{op:0.55,dep:0,thick:0.02,clip:0}); }
    if((k&511)===0){ status(`evaporating · ${Math.round(k/n*100)}%`); await tick(tok); } }
}
let BGIDS=null;

/* Isophote — only the lines where light is equal, in the colour of the surface

  HT.fill(0); status("tracing equal light"); await tick(tok,true);
  const L=new Float32Array(N), Lb=new Float32Array(N); for(let i=0;i<N;i++) L[i]=Math.sqrt(lum(TR[i],TG[i],TB[i])); gauss(L,Lb,W,H,1.1*u);
  const cR=new Float32Array(N),cG=new Float32Array(N),cB=new Float32Array(N); gauss(TR,cR,W,H,1.5*u); gauss(TG,cG,W,H,1.5*u); gauss(TB,cB,W,H,1.5*u);
  const LR=new Float32Array(N),LG=new Float32Array(N),LB=new Float32Array(N), nl=rr(40,56);
  for(let y=1;y<H-1;y++) for(let x=1;x<W-1;x++){ const i=y*W+x; const F=Lb[i]*nl, g=Math.hypot(Lb[i+1]-Lb[i-1],Lb[i+W]-Lb[i-W])*0.5*nl;

  if(DEPF){ const Db=new Float32Array(N); gauss(DEPF,Db,W,H,1.0*u); const step=rr(0.03,0.05);

/* Horologium — a sundial arc behind the tallest object: the direction of its
   shadow at each of the painting's five hours, marked in roman numerals */
const SIG_CAPS_X={V:[[[0,1],[0.35,0],[0.7,1]]],X:[[[0,1],[0.66,0]],[[0,0],[0.66,1]]],I:[[[0.1,0],[0.1,1]]]}, SIG_CAPS_XW={V:0.75,X:0.72,I:0.25};
function paintNumeral(txt,x,y,h,col){ let cx=0; const P={op:0.92,dep:0.05,thick:0.3,clip:0,full:true};
  for(const ch of txt){ const g=SIG_CAPS_X[ch]; for(const st of g){ const f=[]; for(const [a,b] of st) f.push(x+(a+cx)*h*0.8,y-b*h); renderStroke(f,Math.max(0.9,h*0.075),col[0],col[1],col[2],Object.assign({noObj:true},P)); } cx+=SIG_CAPS_XW[ch]+0.15; } }
function paintHours(){ const suns=LIGHTS.filter(L=>L.kind==="sun"); if(suns.length<2) return;
  const fg=OBJS.filter(o=>!o.bg&&!NOFRAME.has(o.kind)&&o.kind!=="knife"&&o.kind!=="plate"); if(!fg.length) return;
  const g=fg.reduce((a,o)=>o.box[4]>a.box[4]?o:a), top=[g.cx,g.box[1]+(g.box[4]-g.box[1])*0.92,g.cz];
  const scr=p=>{ const q=projectPt(p); return [((q[0]-XC)/(2*TW)+0.5)*W,(0.5-(q[1]-YC)/(2*TH))*H]; };
  const col=C(70,42,30);
  // each hour's shadow of the tallest object carries its numeral, just above where the shadow's top lands
  for(const L of suns){ let v=[top[0]-L.p[0],top[1]-L.p[1],top[2]-L.p[2]]; const l=Math.hypot(...v); v=v.map(q=>q/l); if(v[2]<=0.01) continue;
    let t=(WALLZ-top[2])/v[2], hit=[top[0]+v[0]*t,top[1]+v[1]*t,top[2]+v[2]*t], onWall=true;
    if(hit[1]<0){ t=-top[1]/v[1]; hit=[top[0]+v[0]*t,0,top[2]+v[2]*t]; onWall=false; }
    const s=scr(onWall?[hit[0],hit[1]+0.12,hit[2]-0.01]:[hit[0],0.002,hit[2]]); if(s[0]<30*SC||s[0]>W-50*SC||s[1]<30*SC||s[1]>H-30*SC) continue;

/* =============================================================================
   13. SURFACE & AGE
   Relief lit from the window side (Hertzmann 2002); canvas weave where the
   paint is thin; craquelure — a network of fine cracks, dark in the lights

function voronoiEdge(u,v){ const iu=Math.floor(u),iv=Math.floor(v); let f1=9,f2=9;
  for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++){ const cx=iu+i,cy=iv+j; const px=cx+0.1+0.8*hash3i(cx,cy,11), py=cy+0.1+0.8*hash3i(cx,cy,29); const d=Math.hypot(u-px,v-py);
    if(d<f1){f2=f1;f1=d;} else if(d<f2) f2=d; } return f2-f1; }
let GOLD_I=null;
async function finish(tok){ GOLD_I=GM;
  if(PSCH.kind==="delft") return finishDelft(tok); if(PSCH.kind==="woodblock") return finishWoodblock(tok); if(PSCH.kind==="silk") return finishSilk(tok); if(PSCH.kind==="isophote") return finishIsophote(tok);

  const d=IMG.data; const vr=0.97,vg=0.9,vb=0.72;
  for(let y=0;y<H;y++){ for(let x=0;x<W;x++){ const i=y*W+x;

}

function makeTitle(){ const counts={}; for(const b of BODIES){ if(b.skip) continue; counts[b.kind]=(counts[b.kind]||0)+1; }
  const fr=Object.keys(counts).sort((a,b)=>counts[b]-counts[a]).map(k=>{ const n=counts[k]; const p=FRUIT[k].pl;
    if(k==="grapes") return "grapes"; if(k==="pomegranate") return n>1?"pomegranates":"a pomegranate"; if(n===1){ return {apple:"an apple",pear:"a pear",lemon:"a lemon",orange:"an orange",plum:"a plum",peach:"a peach",fig:"a fig",walnut:"a walnut",quince:"a quince",cherry:"cherries"}[k]; } return p; });
  const cut=BODIES.some(b=>b.cut); const items=[...fr.slice(0,3), ...[...new Set(NAMES)].filter(n=>n!=="a knife").slice(0,2)];
  const list=items.length>1?items.slice(0,-1).join(", ")+" and "+items[items.length-1]:items[0]||"fruit";
  const small=new Set(["a","an","and","of","with","the"]);
  return "Still Life with "+list.split(" ").map(w=>small.has(w)?w:w.charAt(0).toUpperCase()+w.slice(1)).join(" "); }

  $("st-prev").disabled=HI<=0; $("st-next").disabled=HI>=HIST.length-1; }
function go(seed,push){ SEED=seed; try{ history.replaceState(null,"",queryFor(seed)); }catch(e){}
  if(push!==false){ HIST=HIST.slice(0,HI+1); HIST.push({seed,st:Object.assign({},ST)}); HI=HIST.length-1; }
  syncUI(); generate(seed); }
function travel(d){ const n=HI+d; if(n<0||n>=HIST.length) return; HI=n; Object.assign(ST,HIST[n].st); go(HIST[n].seed,false); }
function save(){ const a=document.createElement("a"); a.download=`nature-morte-${SEED}${ST.style?"-"+ST.style:""}.png`; a.href=canvas.toDataURL("image/png"); a.click(); }
function toggleLabel(){ labelOn=!labelOn; $("label").classList.toggle("hidden",!labelOn); }
$("studioBtn").onclick=()=>$("studio").classList.toggle("closed");
for(const b of $("st-manner").children) b.onclick=()=>{ ST.style=b.dataset.v; go(SEED); };
for(const b of $("st-version").children) b.onclick=()=>{ ST.detail=b.dataset.v; go(SEED); };
for(const b of $("st-passes").children) b.onclick=()=>{ ST.passes=b.dataset.v; go(SEED); };
for(const k of ["school","comp","backdrop","mirror","light","haze"]) $("st-"+k).onchange=e=>{ ST[k]=e.target.value; go(SEED); };
$("st-clear").onclick=()=>{ for(const k of ["school","comp","backdrop","mirror","light","haze"]) ST[k]=""; go(SEED); };
$("st-go").onclick=()=>go($("st-seed").value.trim()||newSeed());
$("st-seed").onkeydown=e=>{ if(e.key==="Enter"){ e.preventDefault(); $("st-go").click(); } e.stopPropagation(); };
$("st-new").onclick=()=>go(newSeed()); $("st-prev").onclick=()=>travel(-1); $("st-next").onclick=()=>travel(1);
$("st-save").onclick=save; $("st-label").onclick=toggleLabel;
canvas.addEventListener("click",()=>go(newSeed()));
const MKEYS=["","dutch","bodegon","tonal","prima","aurum","delft","moku","silk","evan"];
addEventListener("keydown",e=>{ if(e.target&&e.target.tagName==="SELECT") return; const k=e.key.toLowerCase();
  if(k==="n"||k===" "){ e.preventDefault(); go(newSeed()); }
  else if(k==="s") save(); else if(k==="i") toggleLabel(); else if(k==="m") $("studio").classList.toggle("closed");
  else if(k==="arrowleft") travel(-1); else if(k==="arrowright") travel(1);
  else if(k==="p"){ ST.passes=ST.passes===""?"12":ST.passes==="12"?"16":ST.passes==="16"?"20":""; go(SEED); }
  else if(k==="d"){ ST.detail=ST.detail===""?"fine":ST.detail==="fine"?"ultra":""; go(SEED); }
  else if(k>="0"&&k<="9"){ ST.style=MKEYS[+k]; go(SEED); } });
window.__nm={generate, go, ST, scene:(sd,q)=>{ rand=makeRng(sd); CURSEED=sd; URLQ=q||''; initNoise(); buildScene(); return OBJS.map(o=>o.kind); }, dbg:()=>({objs:OBJS.concat(GLASS).map(o=>o.kind+' '+o.box.map(v=>v.toFixed(2)).join(',')), cam:{TW,TH,XC,YC,EYE}, times:TIMES})};
go(SEED);
} else {
  /* worker: rebuild the scene exactly as the main thread does, then trace the bands asked for */
  self.onmessage=e=>{ const d=e.data;
    rand=makeRng(d.seed); CURSEED=d.seed; initNoise(); URLQ=d.q; buildScene(); setupLight();
    W=d.W; H=d.H; RW=d.RW; RH=d.RH; SC=d.SC; setupCamera();
    const px=new Float64Array(7);
    for(const j0 of d.bands){ const n=Math.min(d.band,RH-j0), N=n*RW;
      const col=new Float32Array(N*3), sp=new Float32Array(N), id=new Int16Array(N), nx=new Float32Array(N), ny=new Float32Array(N), dep=new Float32Array(N);
      for(let jj=0;jj<n;jj++) for(let i=0;i<RW;i++){ const r=renderPixel(i,j0+jj,px), k=jj*RW+i;
        col[k*3]=px[0]; col[k*3+1]=px[1]; col[k*3+2]=px[2]; sp[k]=px[3]; id[k]=r.id; dep[k]=Math.min(r.t,40);
        nx[k]=px[4]*RT[0]+px[5]*RT[1]+px[6]*RT[2]; ny[k]=-(px[4]*UPV[0]+px[5]*UPV[1]+px[6]*UPV[2]); }
      self.postMessage({tok:d.tok,j0,n,col,sp,id,nx,ny,dep},[col.buffer,sp.buffer,id.buffer,nx.buffer,ny.buffer,dep.buffer]); }
    self.postMessage({tok:d.tok,done:true}); };
}
})();
